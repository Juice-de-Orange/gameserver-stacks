name: Bug report
description: The dashboard or a game block does not work as documented, or the docs are wrong.
labels: [bug]
body:
  - type: dropdown
    id: game
    attributes:
      label: Part
      options:
        - Stacks Console (dashboard)
        - Project Zomboid
        - Minecraft
        - Vintage Story
        - Arma Reforger
        - Valheim
        - Avorion
        - Factorio
        - stack helper / repository
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Version
      description: Dashboard - the commit or release (`git describe --tags --always`); a block - its *_TAG value (or "default").
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cd dashboard && ./setup
        2. docker compose up -d
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs --tail 200`. Remove passwords, tokens, IPs and player names first."
      render: text
  - type: input
    id: host
    attributes:
      label: Host
      description: OS, CPU architecture, `docker compose version`.
