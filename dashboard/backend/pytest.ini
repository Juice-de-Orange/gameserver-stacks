; pytest configuration. Pins what would otherwise only hold implicitly (rootdir via the
; `conftest.py` next to this file) and makes room for kinds of tests that should NOT run on
; every invocation.
[pytest]
testpaths = tests
pythonpath = .

; `-q` because the suite otherwise produces more screen than information.
; Both markers are OFF by default: plain `pytest` stays the fast, hermetic gate, and nobody has
; to remember to exclude them.
addopts = -q -m "not smoke and not pg"

markers =
    smoke: needs a RUNNING system. Usage: pytest -m smoke --base-url=https://… [--admin-token=…]
    pg: needs a real Postgres (the migrations do not run on SQLite). Usage: pytest -m pg

; Keep warnings visible — a DeprecationWarning from SQLModel/httpx is the advance notice of a
; break at the next upgrade, not noise.
;
; `error::ResourceWarning` guards against a class of bug, it is not strictness for its own sake:
; an unclosed sqlite3.Connection only reports itself at GC time — in a completely different place
; from where it was created, and easily blamed on the wrong test. As a warning that is
; untraceable; as an error it surfaces where it originates.
filterwarnings =
    default
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
